name: locusscore-pipeline-ci

on:
  push:
    branches: [main]
    paths:
      - "locusscore/pipeline/**"
      - ".github/workflows/locusscore-pipeline-ci.yml"
  pull_request:
    paths:
      - "locusscore/pipeline/**"
      - ".github/workflows/locusscore-pipeline-ci.yml"

defaults:
  run:
    working-directory: locusscore/pipeline

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
